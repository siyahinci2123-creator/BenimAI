<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BenimAI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #070914;
            --sidebar: #0b0e1a;
            --panel: #101525;
            --panel2: #151a2b;
            --border: rgba(255,255,255,.08);
            --text: #f5f7ff;
            --muted: #8b93a7;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            background:
                radial-gradient(circle at 70% 10%, rgba(124,58,237,.13), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(6,182,212,.10), transparent 30%);
        }

        /* SIDEBAR */

        .sidebar {
            width: 270px;
            height: 100vh;
            background: rgba(11,14,26,.92);
            border-right: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: linear-gradient(135deg, var(--purple), var(--cyan));
            box-shadow: 0 0 25px rgba(139,92,246,.25);
        }

        .brand-name {
            font-size: 21px;
            font-weight: 800;
            background: linear-gradient(90deg, #b794ff, #45e6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .new-chat {
            border: 1px solid rgba(255,255,255,.1);
            background: linear-gradient(135deg, #7c3aed, #0891b2);
            color: white;
            padding: 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        .new-chat:hover {
            transform: translateY(-1px);
            filter: brightness(1.12);
        }

        .section-title {
            margin-top: 28px;
            margin-bottom: 10px;
            color: #626b80;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history {
            color: var(--muted);
            font-size: 13px;
            padding: 11px;
            border-radius: 9px;
            cursor: pointer;
        }

        .history:hover {
            background: rgba(255,255,255,.05);
            color: white;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .model-card {
            padding: 13px;
            border-radius: 13px;
            background: rgba(255,255,255,.04);
            border: 1px solid var(--border);
        }

        .model-title {
            font-size: 12px;
            color: #737c91;
        }

        .model-name {
            margin-top: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .online {
            margin-top: 7px;
            color: #4ade80;
            font-size: 11px;
        }

        /* MAIN */

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-bottom: 1px solid var(--border);
            background: rgba(7,9,20,.65);
            backdrop-filter: blur(15px);
        }

        .top-title {
            font-size: 16px;
            font-weight: 700;
        }

        .top-status {
            color: #4ade80;
            font-size: 12px;
        }

        /* CHAT */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 35px 20px;
            scroll-behavior: smooth;
        }

        .welcome {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .welcome-icon {
            width: 75px;
            height: 75px;
            border-radius: 23px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--purple), var(--cyan));
            box-shadow:
                0 0 45px rgba(139,92,246,.25),
                inset 0 0 20px rgba(255,255,255,.15);
        }

        .welcome h1 {
            font-size: 38px;
            background: linear-gradient(90deg, #b794ff, #43e8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome p {
            margin-top: 9px;
            color: var(--muted);
            font-size: 14px;
        }

        .message-row {
            max-width: 850px;
            margin: 0 auto 20px;
            display: flex;
            gap: 12px;
        }

        .avatar {
            flex: 0 0 35px;
            width: 35px;
            height: 35px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
        }

        .ai-avatar {
            background: linear-gradient(135deg, var(--purple), var(--cyan));
        }

        .user-avatar {
            background: #252b3d;
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-name {
            font-size: 12px;
            color: #7f899d;
            margin-bottom: 5px;
        }

        .message {
            line-height: 1.65;
            white-space: pre-wrap;
            font-size: 14px;
            color: #e8ebf4;
        }

        .user-message {
            background: rgba(124,58,237,.13);
            border: 1px solid rgba(139,92,246,.15);
            padding: 12px 15px;
            border-radius: 13px;
        }

        /* INPUT */

        .input-area {
            padding: 10px 25px 25px;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 7px 7px 15px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(16,21,37,.9);
            border-radius: 17px;
            box-shadow: 0 10px 35px rgba(0,0,0,.2);
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 14px;
            padding: 12px 0;
        }

        #messageInput::placeholder {
            color: #687187;
        }

        #sendButton {
            width: 43px;
            height: 43px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--purple), var(--cyan));
            transition: .2s;
        }

        #sendButton:hover {
            transform: scale(1.05);
        }

        .input-info {
            text-align: center;
            margin-top: 9px;
            color: #555e72;
            font-size: 10px;
        }

        /* MOBİL */

        @media(max-width: 700px) {
            .sidebar {
                display: none;
            }

            .topbar {
                padding: 0 16px;
            }

            .messages {
                padding: 20px 12px;
            }

            .input-area {
                padding: 8px 10px 15px;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .message-row {
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">✦</div>
            <div class="brand-name">BenimAI</div>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ Yeni Sohbet
        </button>

        <div class="section-title">
            Sohbetler
        </div>

        <div class="history">
            Henüz sohbet yok
        </div>

        <div class="sidebar-bottom">

            <div class="model-card">

                <div class="model-title">
                    MODEL
                </div>

                <div class="model-name">
                    Qwen 2.5 · 3B
                </div>

                <div class="online">
                    ● Yerel olarak çalışıyor
                </div>

            </div>

        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <div class="top-title">
                Yeni Sohbet
            </div>

            <div class="top-status">
                ● Çevrimiçi
            </div>

        </header>


        <section class="messages" id="messages">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    ✦
                </div>

                <h1>BenimAI</h1>

                <p>Bugün sana nasıl yardımcı olabilirim?</p>

            </div>

        </section>


        <div class="input-area">

            <div class="input-box">

                <input
                    id="messageInput"
                    type="text"
                    autocomplete="off"
                    placeholder="BenimAI'ye bir şey sor..."
                >

                <button id="sendButton">➤</button>

            </div>

            <div class="input-info">
                BenimAI · Yerel yapay zekâ
            </div>

        </div>

    </main>

</div>


<script>

const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const messages = document.getElementById("messages");


function addMessage(text, type) {

    const row = document.createElement("div");
    row.className = "message-row";

    const avatar = document.createElement("div");
    avatar.className = "avatar " +
        (type === "ai" ? "ai-avatar" : "user-avatar");

    avatar.textContent = type === "ai" ? "✦" : "S";

    const content = document.createElement("div");
    content.className = "message-content";

    const name = document.createElement("div");
    name.className = "message-name";
    name.textContent = type === "ai" ? "BenimAI" : "Sen";

    const message = document.createElement("div");
    message.className = "message";

    if (type === "user") {
        message.classList.add("user-message");
    }

    message.textContent = text;

    content.appendChild(name);
    content.appendChild(message);

    row.appendChild(avatar);
    row.appendChild(content);

    messages.appendChild(row);

    messages.scrollTop = messages.scrollHeight;

    return row;
}


async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    addMessage(text, "user");

    input.value = "";

    const loading = addMessage("BenimAI düşünüyor...", "ai");

    sendButton.disabled = true;

    try {

        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text
            })
        });

        const data = await response.json();

        loading.remove();

        if (data.response) {
            addMessage(data.response, "ai");
        } else {
            addMessage("Hata: " + data.error, "ai");
        }

    } catch (error) {

        loading.remove();

        addMessage(
            "Sunucuya bağlanamadım. Flask ve Ollama'nın açık olduğundan emin ol.",
            "ai"
        );

    }

    sendButton.disabled = false;
    input.focus();
}


function newChat() {

    messages.innerHTML = `
        <div class="welcome" id="welcome">
            <div class="welcome-icon">✦</div>
            <h1>BenimAI</h1>
            <p>Bugün sana nasıl yardımcı olabilirim?</p>
        </div>
    `;

    input.focus();
}


sendButton.addEventListener("click", sendMessage);


input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
