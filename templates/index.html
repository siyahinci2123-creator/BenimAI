<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BenimAI</title>

<style>

:root {
    --primary: #8b5cf6;
    --secondary: #06b6d4;
    --bg: #070711;
    --panel: rgba(18, 18, 32, 0.72);
    --panel2: rgba(25, 25, 45, 0.75);
    --text: #f5f5f7;
    --muted: #9292a7;
    --border: rgba(255,255,255,.08);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background:
        radial-gradient(circle at 15% 10%, rgba(139,92,246,.18), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(6,182,212,.12), transparent 30%),
        var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

/* ================= SIDEBAR ================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 270px;

    background: rgba(10,10,20,.82);
    backdrop-filter: blur(25px);

    border-right: 1px solid var(--border);

    padding: 22px;

    display: flex;
    flex-direction: column;

    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 21px;
    font-weight: 800;

    margin-bottom: 28px;
}

.logo-icon {
    width: 36px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background: linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );

    box-shadow:
        0 0 25px rgba(139,92,246,.35);
}

.logo span {
    background: linear-gradient(
        90deg,
        #fff,
        #bca7ff
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.new-chat {
    border: 1px solid rgba(255,255,255,.08);

    background:
        linear-gradient(
            135deg,
            rgba(139,92,246,.18),
            rgba(6,182,212,.08)
        );

    color: white;

    border-radius: 13px;

    padding: 13px;

    cursor: pointer;

    font-size: 14px;
    font-weight: 600;

    transition: .2s;
}

.new-chat:hover {
    transform: translateY(-1px);

    border-color: rgba(139,92,246,.45);

    box-shadow:
        0 8px 30px rgba(139,92,246,.12);
}

.section-title {
    color: #66667b;

    font-size: 11px;
    font-weight: 700;

    margin-top: 28px;
    margin-bottom: 12px;

    text-transform: uppercase;
    letter-spacing: 1px;
}

.empty {
    color: #59596d;
    font-size: 13px;
    padding: 8px;
}

.sidebar-bottom {
    margin-top: auto;
}

.settings {
    width: 100%;

    background: transparent;

    color: #aaaabc;

    border: 1px solid transparent;

    border-radius: 11px;

    padding: 11px;

    text-align: left;

    cursor: pointer;

    transition: .2s;
}

.settings:hover {
    background: rgba(255,255,255,.05);
    color: white;
}

.model-card {
    margin-top: 12px;

    padding: 14px;

    border-radius: 14px;

    background: rgba(255,255,255,.035);

    border: 1px solid var(--border);
}

.model-label {
    color: #6f6f82;
    font-size: 10px;
    letter-spacing: 1px;
}

.model-name {
    margin-top: 6px;

    font-size: 14px;
    font-weight: 600;
}

.online {
    margin-top: 7px;

    color: #67e8a5;

    font-size: 11px;
}

/* ================= MAIN ================= */

.main {
    margin-left: 270px;

    height: 100vh;

    display: flex;
    flex-direction: column;
}

/* HEADER */

.header {
    height: 70px;

    display: flex;
    align-items: center;

    padding: 0 32px;

    border-bottom: 1px solid var(--border);

    background: rgba(7,7,17,.55);

    backdrop-filter: blur(18px);
}

.header-title {
    font-weight: 700;
}

.header-status {
    margin-left: 14px;

    font-size: 12px;

    color: #67e8a5;
}

/* ================= CHAT ================= */

.chat {
    flex: 1;

    overflow-y: auto;

    padding: 35px 10% 150px;
}

.welcome {
    min-height: 65vh;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;
}

.welcome-icon {
    width: 72px;
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 22px;

    font-size: 32px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    box-shadow:
        0 0 60px rgba(139,92,246,.28);
}

.welcome h1 {
    margin: 20px 0 8px;

    font-size: 34px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #bca7ff,
            #67e8f9
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.welcome p {
    color: var(--muted);

    font-size: 14px;
}

/* MESSAGE */

.message {
    display: flex;

    gap: 13px;

    margin: 22px 0;

    animation: messageIn .25s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.avatar {
    width: 34px;
    height: 34px;

    flex-shrink: 0;

    border-radius: 11px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 14px;
    font-weight: 700;

    background: rgba(255,255,255,.08);
}

.ai .avatar {
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );
}

.content {
    max-width: 800px;

    line-height: 1.65;

    font-size: 15px;
}

.name {
    font-size: 12px;

    color: #89899e;

    margin-bottom: 5px;
}

.ai .content {
    color: #eeeeF5;
}

.user .content {
    background: rgba(255,255,255,.055);

    border: 1px solid var(--border);

    padding: 11px 14px;

    border-radius: 13px;
}

/* ================= INPUT ================= */

.input-area {
    position: fixed;

    left: 270px;
    right: 0;
    bottom: 0;

    padding: 18px 10% 22px;

    background:
        linear-gradient(
            transparent,
            rgba(7,7,17,.95) 35%
        );
}

.input-box {
    max-width: 900px;

    margin: auto;

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 8px;

    background: rgba(22,22,38,.85);

    backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,.1);

    border-radius: 17px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.35);
}

textarea {
    flex: 1;

    resize: none;

    border: 0;
    outline: 0;

    background: transparent;

    color: white;

    font-size: 14px;

    padding: 11px;

    max-height: 120px;
}

textarea::placeholder {
    color: #66667a;
}

.send {
    width: 42px;
    height: 42px;

    border: 0;

    border-radius: 12px;

    color: white;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    transition: .2s;
}

.send:hover {
    transform: scale(1.05);

    box-shadow:
        0 0 25px rgba(139,92,246,.35);
}

.info {
    text-align: center;

    color: #555568;

    font-size: 10px;

    margin-top: 8px;
}

/* ================= SETTINGS ================= */

.modal {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.65);

    backdrop-filter: blur(8px);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 100;
}

.modal.active {
    display: flex;
}

.settings-box {
    width: 420px;
    max-width: 90%;

    padding: 25px;

    background: #11111e;

    border: 1px solid var(--border);

    border-radius: 20px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.5);
}

.settings-header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 25px;
}

.close {
    background: transparent;

    border: 0;

    color: #888;

    font-size: 20px;

    cursor: pointer;
}

.theme-grid {
    display: grid;

    grid-template-columns: repeat(2,1fr);

    gap: 10px;
}

.theme {
    padding: 15px;

    border-radius: 13px;

    border: 1px solid var(--border);

    background: rgba(255,255,255,.035);

    color: white;

    cursor: pointer;

    transition: .2s;
}

.theme:hover {
    transform: translateY(-2px);

    border-color: var(--primary);
}

/* ================= MOBILE ================= */

@media(max-width: 800px) {

    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
    }

    .header {
        padding: 0 18px;
    }

    .chat {
        padding: 25px 18px 140px;
    }

    .input-area {
        left: 0;

        padding:
            12px
            15px
            18px;
    }

    .welcome h1 {
        font-size: 27px;
    }

    .content {
        font-size: 14px;
    }
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        <div class="logo-icon">✦</div>
        <span>BenimAI</span>
    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ Yeni Sohbet
    </button>

    <div class="section-title">
        Sohbetler
    </div>

    <div class="empty" id="emptyChats">
        Henüz sohbet yok
    </div>

    <div class="sidebar-bottom">

        <button class="settings" onclick="openSettings()">
            ⚙️ Ayarlar
        </button>

        <div class="model-card">

            <div class="model-label">
                MODEL
            </div>

            <div class="model-name">
                Gemini 3 Flash
            </div>

            <div class="online">
                ● Çevrimiçi
            </div>

        </div>

    </div>

</aside>


<!-- MAIN -->

<main class="main">

    <header class="header">

        <div class="header-title">
            Yeni Sohbet
        </div>

        <div class="header-status">
            ● Çevrimiçi
        </div>

    </header>


    <section class="chat" id="chat">

        <div class="welcome" id="welcome">

            <div class="welcome-icon">
                ✦
            </div>

            <h1>
                BenimAI
            </h1>

            <p>
                Fikirlerini gerçeğe dönüştürmek için buradayım.
            </p>

        </div>

    </section>


    <div class="input-area">

        <div class="input-box">

            <textarea
                id="message"
                rows="1"
                placeholder="BenimAI'ye bir şey sor..."
            ></textarea>

            <button
                class="send"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

        <div class="info">
            BenimAI · Yapay zekâ asistanı
        </div>

    </div>

</main>


<!-- SETTINGS -->

<div class="modal" id="settingsModal">

    <div class="settings-box">

        <div class="settings-header">

            <h2>⚙️ Ayarlar</h2>

            <button
                class="close"
                onclick="closeSettings()"
            >
                ×
            </button>

        </div>

        <p style="color:#888;font-size:13px">
            BenimAI'nin görünümünü kişiselleştir.
        </p>

        <div class="theme-grid">

            <button
                class="theme"
                onclick="setTheme('#8b5cf6','#06b6d4')"
            >
                💜 Mor
            </button>

            <button
                class="theme"
                onclick="setTheme('#3b82f6','#06b6d4')"
            >
                💙 Mavi
            </button>

            <button
                class="theme"
                onclick="setTheme('#10b981','#22d3ee')"
            >
                💚 Yeşil
            </button>

            <button
                class="theme"
                onclick="setTheme('#ef4444','#f97316')"
            >
                ❤️ Kırmızı
            </button>

            <button
                class="theme"
                onclick="setTheme('#f97316','#facc15')"
            >
                🧡 Turuncu
            </button>

        </div>

    </div>

</div>


<script>

const messageInput =
    document.getElementById("message");

const chat =
    document.getElementById("chat");

const welcome =
    document.getElementById("welcome");


/* ================= SEND ================= */

async function sendMessage() {

    const message =
        messageInput.value.trim();

    if (!message) return;

    if (welcome) {
        welcome.remove();
    }

    addMessage(
        "user",
        message
    );

    messageInput.value = "";

    const loading =
        addMessage(
            "ai",
            "BenimAI düşünüyor..."
        );

    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: message
                })

            });

        const data =
            await response.json();

        loading.remove();

        if (data.response) {

            addMessage(
                "ai",
                data.response
            );

        } else {

            addMessage(
                "ai",
                "Bir hata oluştu."
            );

        }

    } catch (error) {

        loading.remove();

        addMessage(
            "ai",
            "Sunucuya bağlanamadım."
        );

    }

}


/* ================= MESSAGE ================= */

function addMessage(
    type,
    text
) {

    const message =
        document.createElement("div");

    message.className =
        `message ${type}`;

    const avatar =
        type === "ai"
            ? "✦"
            : "S";

    const name =
        type === "ai"
            ? "BenimAI"
            : "Sen";

    message.innerHTML = `

        <div class="avatar">
            ${avatar}
        </div>

        <div class="content">

            <div class="name">
                ${name}
            </div>

            <div>
                ${escapeHtml(text)}
            </div>

        </div>
    `;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;

    return message;
}


/* ================= ESCAPE ================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* ================= NEW CHAT ================= */

function newChat() {

    chat.innerHTML = `

        <div class="welcome" id="welcome">

            <div class="welcome-icon">
                ✦
            </div>

            <h1>
                BenimAI
            </h1>

            <p>
                Fikirlerini gerçeğe dönüştürmek için buradayım.
            </p>

        </div>
    `;

}


/* ================= SETTINGS ================= */

function openSettings() {

    document
        .getElementById("settingsModal")
        .classList
        .add("active");

}

function closeSettings() {

    document
        .getElementById("settingsModal")
        .classList
        .remove("active");

}


/* ================= THEME ================= */

function setTheme(
    primary,
    secondary
) {

    document.documentElement
        .style
        .setProperty(
            "--primary",
            primary
        );

    document.documentElement
        .style
        .setProperty(
            "--secondary",
            secondary
        );

    localStorage.setItem(
        "primary",
        primary
    );

    localStorage.setItem(
        "secondary",
        secondary
    );

    closeSettings();

}


/* ================= LOAD THEME ================= */

const savedPrimary =
    localStorage.getItem("primary");

const savedSecondary =
    localStorage.getItem("secondary");

if (
    savedPrimary &&
    savedSecondary
) {

    document.documentElement
        .style
        .setProperty(
            "--primary",
            savedPrimary
        );

    document.documentElement
        .style
        .setProperty(
            "--secondary",
            savedSecondary
        );

}


/* ================= ENTER ================= */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ================= CLOSE MODAL ================= */

document
    .getElementById("settingsModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeSettings();

            }

        }
    );

</script>

</body>
</html>
